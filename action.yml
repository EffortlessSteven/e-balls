name: e-balls
description: Race occurrences of e in perl-lsp commit messages as a GIF and MP4
branding:
  icon: activity
  color: green

inputs:
  repository:
    description: Public GitHub owner/repository to read
    default: EffortlessMetrics/perl-lsp-swarm
  ref:
    description: Source branch to inspect
    default: main
  project:
    description: Project name in the chart title
    default: perl-lsp
  since:
    description: Completed UTC time window (7d)
    default: 7d
  end:
    description: Optional exclusive UTC end date (YYYY-MM-DD), for a reproducible week
    default: ''
  letter:
    description: ASCII letter to count in full commit messages
    default: e
  avatar:
    description: Optional path to a local PNG/JPEG portrait; defaults to the bundled Steven portrait
    default: ''
  data:
    description: Optional saved counts JSON to re-render without fetching Git history
    default: ''
  format:
    description: mp4, gif, or both
    default: both
  output:
    description: New output directory
    default: e-balls-output
  asset-base-url:
    description: Optional public URL prefix for links in embed.md
    default: ''

outputs:
  directory:
    description: Absolute directory containing the files
    value: ${{ steps.render.outputs.directory }}
  markdown:
    description: Embed markdown for the GIF and/or MP4
    value: ${{ steps.render.outputs.markdown }}
  manifest:
    description: JSON manifest path
    value: ${{ steps.render.outputs.manifest }}
  data:
    description: JSON input snapshot path
    value: ${{ steps.render.outputs.data }}

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@1.88
    - id: binary-key
      shell: bash
      run: |
        set -euo pipefail
        digest=$(cat "$GITHUB_ACTION_PATH"/Cargo.toml "$GITHUB_ACTION_PATH"/Cargo.lock "$GITHUB_ACTION_PATH"/src/*.rs "$GITHUB_ACTION_PATH"/src/bin/*.rs "$GITHUB_ACTION_PATH"/assets/*.ttf | sha256sum | cut -d' ' -f1)
        echo "path=$GITHUB_ACTION_PATH/target/release/e-balls" >> "$GITHUB_OUTPUT"
        echo "key=e-balls-rust-${{ runner.os }}-${{ runner.arch }}-${{ runner.imageos }}-$digest" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      id: binary
      with:
        path: ${{ steps.binary-key.outputs.path }}
        key: ${{ steps.binary-key.outputs.key }}
    - name: Build e-balls on cache miss
      if: steps.binary.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        if ! pkg-config --exists freetype2; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfreetype6-dev pkg-config
        fi
        cargo build --release --locked --manifest-path "$GITHUB_ACTION_PATH/Cargo.toml" --bin e-balls
    - name: Install FFmpeg if missing
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v ffmpeg >/dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
        fi
    - id: render
      shell: bash
      env:
        EB_REPOSITORY: ${{ inputs.repository }}
        EB_REF: ${{ inputs.ref }}
        EB_PROJECT: ${{ inputs.project }}
        EB_SINCE: ${{ inputs.since }}
        EB_END: ${{ inputs.end }}
        EB_LETTER: ${{ inputs.letter }}
        EB_AVATAR: ${{ inputs.avatar }}
        EB_DATA: ${{ inputs.data }}
        EB_FORMAT: ${{ inputs.format }}
        EB_OUTPUT: ${{ inputs.output }}
        EB_ASSET_BASE: ${{ inputs.asset-base-url }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action_render.sh"
