name: e-balls
description: Race the letters behind a release as a GIF and MP4. A GitHub Action.
branding:
  icon: activity
  color: green

inputs:
  repository:
    description: Public GitHub owner/repository to read
    default: ${{ github.repository }}
  ref:
    description: Optional source branch (defaults to the repository default)
    default: ''
  project:
    description: Optional project name in the chart title (defaults to source repository name)
    default: ''
  since:
    description: Completed UTC time window (7d)
    default: 7d
  end:
    description: Optional exclusive UTC end date (YYYY-MM-DD), for a reproducible week
    default: ''
  letter:
    description: ASCII letter to count in full commit messages
    default: e
  avatar:
    description: Optional local PNG/JPEG portrait; otherwise resolve the top contributing GitHub author
    default: ''
  data:
    description: Optional saved counts JSON to re-render; requires explicit avatar
    default: ''
  token:
    description: GitHub token for resolving the top contributor; only sent to api.github.com
    default: ${{ github.token }}
  format:
    description: mp4, gif, or both
    default: both
  output:
    description: New output directory
    default: e-balls-output
  asset-base-url:
    description: Optional public URL prefix for links in embed.md
    default: ''

outputs:
  directory:
    description: Absolute directory containing the files
    value: ${{ steps.render.outputs.directory }}
  markdown:
    description: Embed markdown for the GIF and/or MP4
    value: ${{ steps.render.outputs.markdown }}
  manifest:
    description: JSON manifest path
    value: ${{ steps.render.outputs.manifest }}
  data:
    description: JSON input snapshot path
    value: ${{ steps.render.outputs.data }}

runs:
  using: composite
  steps:
    - id: binary-key
      shell: bash
      run: |
        set -euo pipefail
        digest=$(bash "$GITHUB_ACTION_PATH/scripts/action_cache_key.sh" "$GITHUB_ACTION_PATH")
        os=$(sha256sum /etc/os-release | cut -d ' ' -f 1)
        echo "key=e-balls-v2-rust1.88.0-${{ runner.os }}-${{ runner.arch }}-${ImageOS:-$os}-$digest" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@v4
      id: binary
      with:
        path: |
          ${{ github.action_path }}/target/release/e-balls
          ${{ github.action_path }}/target/release/e-balls-collect
        key: ${{ steps.binary-key.outputs.key }}
    - name: Native runtime dependencies
      shell: bash
      run: |
        set -euo pipefail
        packages=()
        command -v git >/dev/null || packages+=(git)
        command -v ffmpeg >/dev/null || packages+=(ffmpeg)
        if ! ldconfig -p | grep -F 'libfreetype.so.6' >/dev/null; then
          packages+=(libfreetype6)
        fi
        if (( ${#packages[@]} )); then
          sudo apt-get update -qq
          sudo apt-get install -y -qq "${packages[@]}"
        fi
    - id: ready
      name: Check the restored binary pair
      shell: bash
      env:
        RESTORED: ${{ steps.binary.outputs.cache-hit }}
      run: |
        set -euo pipefail
        ready=false
        if [[ "$RESTORED" == true ]] &&
           "$GITHUB_ACTION_PATH/target/release/e-balls" --version >/dev/null 2>&1 &&
           "$GITHUB_ACTION_PATH/target/release/e-balls-collect" --version >/dev/null 2>&1; then
          ready=true
        fi
        echo "value=$ready" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@1.88.0
      if: steps.ready.outputs.value != 'true'
    - id: build
      name: Build e-balls on cache miss
      if: steps.ready.outputs.value != 'true'
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v pkg-config >/dev/null || ! pkg-config --exists freetype2; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfreetype6-dev pkg-config
        fi
        cargo build --release --locked --manifest-path "$GITHUB_ACTION_PATH/Cargo.toml" --bin e-balls --bin e-balls-collect
    - name: Save binaries before collecting repository data
      uses: actions/cache/save@v4
      if: steps.binary.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
      with:
        path: |
          ${{ github.action_path }}/target/release/e-balls
          ${{ github.action_path }}/target/release/e-balls-collect
        key: ${{ steps.binary-key.outputs.key }}
    - id: render
      shell: bash
      env:
        EB_REPOSITORY: ${{ inputs.repository }}
        EB_REF: ${{ inputs.ref }}
        EB_PROJECT: ${{ inputs.project }}
        EB_TOKEN: ${{ inputs.token }}
        EB_SINCE: ${{ inputs.since }}
        EB_END: ${{ inputs.end }}
        EB_LETTER: ${{ inputs.letter }}
        EB_AVATAR: ${{ inputs.avatar }}
        EB_DATA: ${{ inputs.data }}
        EB_FORMAT: ${{ inputs.format }}
        EB_OUTPUT: ${{ inputs.output }}
        EB_ASSET_BASE: ${{ inputs.asset-base-url }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action_render.sh"
