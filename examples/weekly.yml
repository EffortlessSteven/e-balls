name: Weekly e-balls
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: EffortlessSteven/e-balls@main
        id: balls
        with:
          repository: EffortlessMetrics/perl-lsp-swarm
          project: perl-lsp
          since: 7d
          format: both

      - uses: actions/upload-artifact@v4
        with:
          name: weekly-e-balls
          path: ${{ steps.balls.outputs.directory }}
