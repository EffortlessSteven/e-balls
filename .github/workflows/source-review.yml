name: Temporary source review
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'EffortlessSteven/e-balls' && github.head_ref == 'feat/literal-string-counts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Package the pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/formatter/lib"
          formatter=$(rustup which --toolchain 1.88.0 rustfmt)
          cp "$formatter" "$RUNNER_TEMP/formatter/rustfmt"
          ldd "$formatter" | tee "$RUNNER_TEMP/formatter/dependencies.txt"
          for library in $(ldd "$formatter" | awk '/\.rustup\// {print $3}'); do
            cp "$library" "$RUNNER_TEMP/formatter/lib/"
          done
          "$formatter" --version > "$RUNNER_TEMP/formatter/version.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-review-formatter
          retention-days: 1
          path: ${{ runner.temp }}/formatter/
