name: CI
on:
  pull_request:
    paths-ignore:
      - README.md
      - AGENTS.md
      - 'docs/**'
      - LICENSE
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - AGENTS.md
      - 'docs/**'
      - LICENSE
  # Live repository/avatar integrations and full demo renders are opt-in.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e-balls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.repository == 'EffortlessSteven/e-balls'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record the checkout being tested
        run: |
          mkdir -p verification
          git rev-parse HEAD | tee verification/renderer-commit.txt
          git status --porcelain=v1 > verification/initial-status.txt
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master; Rust 1.88.0
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - name: Rust formatting
        run: cargo fmt --all -- --check 2>&1 | tee verification/rustfmt.log
      - name: Native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfreetype6-dev pkg-config ffmpeg
          rustc --version | tee verification/toolchain.txt
          cargo --version | tee -a verification/toolchain.txt
          ffmpeg -version | head -n 1 | tee -a verification/toolchain.txt
      - name: Build all binaries
        run: cargo build --release --locked --bins 2>&1 | tee verification/build.log
      - name: Rust tests
        run: cargo test --locked --all-targets 2>&1 | tee verification/rust-tests.log
      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings 2>&1 | tee verification/clippy.log
      - name: Git collector and actual CLI/media tests
        env:
          EBALLS_BIN: target/release/e-balls
          EBALLS_COLLECT_BIN: target/release/e-balls-collect
        run: python3 -m unittest discover -s tests -v 2>&1 | tee verification/python-tests.log
      - name: Render the pinned perl-lsp example
        if: github.event_name == 'workflow_dispatch'
        run: |
          git clone --bare --filter=blob:none --single-branch --branch main --no-tags \
            https://github.com/EffortlessMetrics/perl-lsp-swarm.git "$RUNNER_TEMP/perl-lsp.git"
          git -C "$RUNNER_TEMP/perl-lsp.git" config remote.origin.pushurl DISABLED
          ./target/release/e-balls-collect \
            --repo "$RUNNER_TEMP/perl-lsp.git" \
            --ref 31b87ee79b8fb55b6433bed7c1f1e4478443d61e \
            --repository EffortlessMetrics/perl-lsp-swarm --project perl-lsp \
            --since 7d --end 2026-10-11 --out "$RUNNER_TEMP/e-counts.json"
          python3 scripts/verify_counts.py --repo "$RUNNER_TEMP/perl-lsp.git" \
            --data "$RUNNER_TEMP/e-counts.json" | tee verification/count-verification.json
          ./target/release/e-balls --data "$RUNNER_TEMP/e-counts.json" \
            --avatar examples/perl-lsp-2026-10-04/avatar.png --format both --out out
          cp verification/count-verification.json out/count-verification.json
          ffmpeg -v error -xerror -i out/e-balls.mp4 -f null -
          ffmpeg -v error -xerror -i out/e-balls.gif -f null -
          ffprobe -v error -show_streams -show_format -of json out/e-balls.mp4 > out/mp4-probe.json
          ffprobe -v error -show_streams -show_format -of json out/e-balls.gif > out/gif-probe.json
          ffmpeg -v error -ss 0.5 -i out/e-balls.mp4 -frames:v 1 out/preview.png
          cp verification/renderer-commit.txt out/renderer-commit.txt
          (cd out && sha256sum data.json avatar.png manifest.json e-balls.mp4 e-balls.gif > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: e-balls-verification-${{ github.event_name }}
          path: verification/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        with:
          name: e-balls-binaries-${{ github.event_name }}
          path: |
            target/release/e-balls
            target/release/e-balls-collect
            target/release/release-balls
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        with:
          name: e-balls-perl-lsp-${{ github.event_name }}
          path: out/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

  action-smoke:
    if: github.repository == 'EffortlessSteven/e-balls' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./
        id: balls
        with:
          repository: EffortlessMetrics/perl-lsp-swarm
          ref: 31b87ee79b8fb55b6433bed7c1f1e4478443d61e
          project: perl-lsp
          since: 7d
          end: '2026-10-11'
          format: both
          output: ${{ runner.temp }}/e-balls-action-live
      - name: Check live counts, real GitHub contributor avatar and playable media
        shell: bash
        env:
          BALLS_DIRECTORY: ${{ steps.balls.outputs.directory }}
          BALLS_MANIFEST: ${{ steps.balls.outputs.manifest }}
          BALLS_DATA: ${{ steps.balls.outputs.data }}
          BALLS_MARKDOWN: ${{ steps.balls.outputs.markdown }}
        run: |
          set -euo pipefail
          test -f "$BALLS_DIRECTORY/e-balls.mp4"
          test -f "$BALLS_DIRECTORY/e-balls.gif"
          test -f "$BALLS_MANIFEST"
          test -f "$BALLS_DATA"
          test -f "$BALLS_MARKDOWN"
          ffmpeg -v error -xerror -i "$BALLS_DIRECTORY/e-balls.mp4" -f null -
          ffmpeg -v error -xerror -i "$BALLS_DIRECTORY/e-balls.gif" -f null -
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          directory = Path(os.environ['BALLS_DIRECTORY'])
          data = json.loads(Path(os.environ['BALLS_DATA']).read_text())
          manifest = json.loads(Path(os.environ['BALLS_MANIFEST']).read_text())
          source = data['source']
          top = source['top_contributor']
          assert source['repository'] == 'EffortlessMetrics/perl-lsp-swarm'
          assert source['commit'] == '31b87ee79b8fb55b6433bed7c1f1e4478443d61e'
          assert source['end_exclusive'] == '2026-10-11T00:00:00Z'
          assert source['total_commits'] == 129
          assert source['total_count'] == 19412
          assert [r['count'] for r in data['rows']] == [5773,5691,3809,3292,109,4,734]
          assert top['login'] and top['id'] > 0 and top['counted_letters'] > 0
          assert top['sample_commit'] in {r['sha'] for r in source['commits']}
          assert top['avatar_url'] == f"https://avatars.githubusercontent.com/u/{top['id']}?s=512&v=4"
          assert hashlib.sha256((directory/'avatar.png').read_bytes()).hexdigest() == top['avatar_sha256']
          assert manifest['rows'] == [[row['label'], row['count']] for row in data['rows']]
          assert 'e-balls.gif' in Path(os.environ['BALLS_MARKDOWN']).read_text()
          assert 'e-balls.mp4' in Path(os.environ['BALLS_MARKDOWN']).read_text()
          print(json.dumps({'top_contributor':top,'commit':source['commit']},sort_keys=True))
          PY
      - name: Reject saved data without an explicit avatar
        shell: bash
        env:
          EB_REPOSITORY: EffortlessMetrics/perl-lsp-swarm
          EB_REF: ''
          EB_PROJECT: perl-lsp
          EB_TOKEN: ''
          EB_SINCE: 7d
          EB_END: ''
          EB_LETTER: e
          EB_AVATAR: ''
          EB_DATA: examples/perl-lsp-2026-10-04-teal/data.json
          GITHUB_ACTION_PATH: ${{ github.workspace }}
          GITHUB_OUTPUT: ${{ runner.temp }}/saved-reject-output.txt
          EB_FORMAT: gif
          EB_OUTPUT: ${{ runner.temp }}/should-not-exist
        run: |
          set -euo pipefail
          if bash scripts/action_render.sh 2>"$RUNNER_TEMP/reject.log"; then
            echo "saved data was accepted without an avatar" >&2
            exit 1
          fi
          grep -q "saved data requires an explicit avatar" "$RUNNER_TEMP/reject.log"
          test ! -e "$EB_OUTPUT"

      - uses: ./
        id: different-contributor
        with:
          repository: EffortlessSteven/e-balls
          ref: 2ac0374373eff3cf60c201565d7137c0ccedcbe8
          project: release-balls
          since: 7d
          end: '2026-09-29'
          format: gif
          output: ${{ runner.temp }}/e-balls-maria-week
      - name: Confirm an unrelated repository history selects Maria, not Steven
        env:
          BALLS_DIRECTORY: ${{ steps.different-contributor.outputs.directory }}
          BALLS_DATA: ${{ steps.different-contributor.outputs.data }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          directory=Path(os.environ['BALLS_DIRECTORY'])
          source=json.loads(Path(os.environ['BALLS_DATA']).read_text())['source']
          top=source['top_contributor']
          assert source['repository']=='EffortlessSteven/e-balls'
          assert top['login']=='maria-rcks', top
          assert top['id']!=15812269
          assert top['sample_commit'] in {receipt['sha'] for receipt in source['commits']}
          assert hashlib.sha256((directory/'avatar.png').read_bytes()).hexdigest()==top['avatar_sha256']
          assert (directory/'avatar.png').read_bytes() != Path('examples/perl-lsp-2026-10-04-teal/avatar.png').read_bytes()
          assert source['total_commits'] > 0
          print(json.dumps({'winner':top['login'],'author_commits':top['authored_commits'],'counted_letters':top['counted_letters']},sort_keys=True))
          PY
          ffmpeg -v error -xerror -i "$BALLS_DIRECTORY/e-balls.gif" -f null -
      - uses: ./
        id: literal-string
        with:
          repository: EffortlessSteven/e-balls
          ref: 2ac0374373eff3cf60c201565d7137c0ccedcbe8
          project: release-balls
          text: 'feat:'
          case-sensitive: 'true'
          since: 7d
          end: '2026-09-29'
          format: both
          output: ${{ runner.temp }}/e-balls-literal-string
      - name: Independently recount literal-string Action output
        env:
          BALLS_DIRECTORY: ${{ steps.literal-string.outputs.directory }}
          BALLS_DATA: ${{ steps.literal-string.outputs.data }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --bare --filter=blob:none --single-branch --branch main --no-tags \
            https://github.com/EffortlessSteven/e-balls.git "$RUNNER_TEMP/string-history.git"
          git -C "$RUNNER_TEMP/string-history.git" config remote.origin.pushurl DISABLED
          python3 scripts/verify_counts.py --repo "$RUNNER_TEMP/string-history.git" --data "$BALLS_DATA"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          directory = Path(os.environ['BALLS_DIRECTORY'])
          data = json.loads(Path(os.environ['BALLS_DATA']).read_text())
          source = data['source']
          matcher = {'kind':'literal','text':'feat:','case':'sensitive','overlapping':False}
          assert source['matcher'] == matcher
          assert source['commit'] == '2ac0374373eff3cf60c201565d7137c0ccedcbe8'
          assert source['total_count'] > 0
          assert source['top_contributor']['counted_matches'] > 0
          assert source['top_contributor']['matcher'] == matcher
          assert 'counted_letters' not in source['top_contributor']
          assert json.loads((directory / 'manifest.json').read_text())['matcher'] == matcher
          PYCODE
          ffmpeg -v error -xerror -i "$BALLS_DIRECTORY/e-balls.gif" -f null -
          ffmpeg -v error -xerror -i "$BALLS_DIRECTORY/e-balls.mp4" -f null -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: e-balls-literal-string-${{ github.event_name }}
          path: ${{ steps.literal-string.outputs.directory }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && steps.balls.outputs.directory != '' }}
        with:
          name: e-balls-selected-avatar-${{ github.event_name }}
          path: ${{ steps.balls.outputs.directory }}
          if-no-files-found: ignore
          retention-days: 7
